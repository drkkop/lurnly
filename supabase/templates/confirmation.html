<!--
  Gabarit de PREMIÈRE inscription.

  Supabase choisit `confirmation` quand l'adresse est inconnue, et `magic_link`
  quand elle existe déjà. Les deux doivent donc être configurés : n'en définir
  qu'un laisse l'autre en anglais, avec le gabarit par défaut.

  Comme pour le magic link, on envoie `{{ .TokenHash }}` et non
  `{{ .ConfirmationURL }}` : les clients mail préchargent les liens pour en
  faire un aperçu, et une URL de confirmation se consomme à ce moment-là.
-->
<h2>Votre place est réservée</h2>

<p>Cliquez pour confirmer votre adresse et préparer votre profil. Ce lien vaut une heure et ne sert qu'une fois.</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirmer?token_hash={{ .TokenHash }}&type=email">
    Entrer sur Lurnly
  </a>
</p>

<p>Si vous n'avez rien demandé, ignorez ce message : personne n'a accès à votre compte sans ce lien.</p>

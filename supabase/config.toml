project_id = "lurnly"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
# `prive` n'est volontairement PAS exposé : c'est là que vivent les fonctions
# SECURITY DEFINER et, plus tard, les jetons OAuth Stripe/Shopify.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/retour"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Pas de mot de passe : magic link seul. L'inscription est immédiate, la
# vérification de l'email est différée — cliquer le lien valide la place
# dans la file d'attente.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false

[storage]
enabled = true
file_size_limit = "5MiB"

project_id = "lurnly"

# Ports décalés sur la plage 5433x : le projet Supabase `flowdash_V2` occupe
# déjà la plage par défaut 5432x. Les deux bases tournent ainsi en parallèle,
# sans avoir à arrêter l'une pour travailler sur l'autre.

[api]
enabled = true
port = 54331
schemas = ["public", "graphql_public"]
# `prive` n'est volontairement PAS exposé : c'est là que vivent les fonctions
# SECURITY DEFINER et, plus tard, les jetons OAuth Stripe/Shopify.
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54332
shadow_port = 54330
major_version = 17

[studio]
enabled = true
port = 54333

# Boîte mail de test. Aucun email ne part vers une vraie adresse en local.
[inbucket]
enabled = true
port = 54334

# Analytics désactivé : ce conteneur (Logflare) demande une configuration
# supplémentaire et fait échouer `db reset` en local. On ne s'en sert pas.
[analytics]
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirmer"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Pas de mot de passe : magic link seul. L'inscription est immédiate, la
# vérification de l'email est différée — cliquer le lien valide la place
# dans la file d'attente.
enable_confirmations = true
double_confirm_changes = true
secure_password_change = false

# Gabarit maison : il envoie un token hash, pas une URL de confirmation
# auto-consommée. Voir le commentaire en tête du fichier.
[auth.email.template.magic_link]
subject = "Votre lien pour entrer sur Lurnly"
content_path = "./supabase/templates/magic_link.html"

[storage]
enabled = true
file_size_limit = "5MiB"
